[package]
name = "unflash-h264"
version = "0.1.0"
edition = "2021"
description = "A small H.264 / AVC decoder (Constrained Baseline, Main and High, 4:2:0 8-bit, progressive and interlaced) for browsers without one"
license = "MIT"

[dependencies]
wide = { version = "0.7", optional = true }

[dev-dependencies]
unflash-mp4 = { path = "../unflash-mp4" }
md5 = "0.7"

[features]
default = ["simd"]
simd = ["dep:wide"]
