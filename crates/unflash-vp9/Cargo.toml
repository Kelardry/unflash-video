[package]
name = "unflash-vp9"
version = "0.1.0"
edition = "2021"
description = "A small VP9 decoder (profiles 0 and 2: 8, 10 and 12-bit 4:2:0) for browsers without one"
license = "MIT"

[dependencies]
wide = { version = "0.7", optional = true }

[dev-dependencies]
unflash-mp4 = { path = "../unflash-mp4" }
md5 = "0.7"

[features]
default = ["simd"]
simd = ["dep:wide"]
