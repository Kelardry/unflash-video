[package]
name = "unflash-decoders"
description = "wasm-bindgen bindings for Unflash's built-in HEVC, VP9, VP8 and AV1 decoders and its AC-3 / E-AC-3 and DTS sound decoders: a module of their own, loaded when a browser lacks the decoder for a file"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
unflash-core = { path = "../unflash-core" }
unflash-vp8 = { path = "../unflash-vp8" }
unflash-vp9 = { path = "../unflash-vp9" }
unflash-av1 = { path = "../unflash-av1" }
wasm-bindgen = "0.2.128"
serde_json.workspace = true
console_error_panic_hook = "0.1"
unflash-hevc = { path = "../unflash-hevc" }
unflash-sound = { path = "../unflash-sound" }
