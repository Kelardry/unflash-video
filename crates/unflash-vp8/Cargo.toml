[package]
name = "unflash-vp8"
version = "0.1.0"
edition = "2021"
description = "A small VP8 decoder (RFC 6386, all profiles) for browsers without one"
license = "MIT"

[dependencies]
bytemuck = { workspace = true, optional = true }
wide = { version = "0.7", optional = true }

[dev-dependencies]
unflash-mp4 = { path = "../unflash-mp4" }
md5 = "0.7"

[features]
default = ["simd"]
simd = ["dep:wide", "dep:bytemuck"]
