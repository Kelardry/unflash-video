[package]
name = "unflash-av1"
description = "AV1 decoding for Unflash: a small wrapper over rav1d (the Rust port of dav1d) that gives 8-bit 4:2:0 pictures"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# bitdepth_16: 10-bit streams (their film grain among other things; rav1d
# builds its 16-bit pixel code either way, see third_party/rav1d/UNFLASH.md)
rav1d ={ path = "../../third_party/rav1d", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

# dav1d's errno-valued results (wasm has no errno values: see EAGAIN in lib.rs)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
libc = "0.2"

[dev-dependencies]
unflash-mp4 = { path = "../unflash-mp4" }
md5 = "0.7"
